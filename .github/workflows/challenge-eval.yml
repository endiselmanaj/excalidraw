name: Challenge Evaluation

on:
  pull_request_target:
    branches: [challenge/excalidraw-lasso-selection]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # --- Phase 1: Automated Checks ---
      - name: Typecheck
        id: typecheck
        run: yarn test:typecheck
        continue-on-error: true

      - name: Run lasso tests
        id: lasso-tests
        run: |
          if [ -f "packages/excalidraw/tests/lasso.test.tsx" ]; then
            yarn vitest run packages/excalidraw/tests/lasso.test.tsx --run 2>&1 | tee /tmp/lasso-results.txt
          else
            echo "No lasso test file found"
            exit 1
          fi
        continue-on-error: true

      - name: Check for regressions
        id: regressions
        run: |
          echo "failures=0" >> $GITHUB_OUTPUT
          echo "regressions=false" >> $GITHUB_OUTPUT
          echo "Regression check skipped (full test suite too slow for CI)"

      # --- Phase 2: AI Grading ---
      - name: Extract submission diff
        run: |
          git diff origin/challenge/excalidraw-lasso-selection...${{ github.event.pull_request.head.sha }} > /tmp/submission.patch
          echo "Submission diff: $(wc -l < /tmp/submission.patch) lines"

      - name: Grade with Claude AI
        id: ai-grade
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          LASSO_RESULT: ${{ steps.lasso-tests.outcome }}
          REGRESSIONS: ${{ steps.regressions.outputs.regressions }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret configured — skipping AI grading"
            echo '{}' > /tmp/ai-scores.json
            exit 0
          fi

          head -1000 .challenge/eval/golden-diff.patch > /tmp/golden-truncated.patch

          python3 << 'PYEOF' > /tmp/api-request.json
          import json, os
          challenge = open('.challenge/CHALLENGE.md').read()
          rubric = open('.challenge/eval/rubric.md').read()
          eval_config = open('.challenge/eval/eval-config.json').read()
          golden = open('/tmp/golden-truncated.patch').read()
          submission = open('/tmp/submission.patch').read()
          typecheck = os.environ.get('TYPECHECK_RESULT', 'unknown')
          lasso = os.environ.get('LASSO_RESULT', 'unknown')
          regressions = os.environ.get('REGRESSIONS', 'unknown')

          prompt = f"""You are an expert code reviewer evaluating a coding challenge submission. Provide DETAILED, SPECIFIC feedback with code examples.

          ## Challenge Spec
          {challenge}

          ## Scoring Rubric
          {rubric}

          ## Eval Config
          {eval_config}

          ## Automated Check Results (ground truth)
          - Typecheck: {typecheck}
          - Lasso tests: {lasso}
          - Regressions: {regressions}

          ## Golden Diff (one valid reference approach)
          ```
          {golden}
          ```

          ## Participant Submission Diff
          ```
          {submission}
          ```

          Score this submission with DETAILED per-dimension feedback. For each score, explain what was done well and what is missing.

          INCLUDE 2-4 code_examples comparing the participant code with the reference. Pick the most instructive differences. Show short snippets (5-15 lines). If the participant did not implement something, use "// Not implemented" as their code.

          A different but correct approach should score well. Hard gates: If typecheck fails OR regressions exist, cap total at 30.

          Call submit_score with your detailed evaluation including code examples."""

          request = {
              "model": "claude-sonnet-4-20250514",
              "max_tokens": 8192,
              "tools": [{
                  "name": "submit_score",
                  "description": "Submit the evaluation score",
                  "input_schema": {
                      "type": "object",
                      "properties": {
                          "scores": {
                              "type": "object",
                              "properties": {
                                  "correctness": {"type": "number", "minimum": 0, "maximum": 35},
                                  "correctness_details": {"type": "string"},
                                  "code_quality": {"type": "number", "minimum": 0, "maximum": 20},
                                  "code_quality_details": {"type": "string"},
                                  "completeness": {"type": "number", "minimum": 0, "maximum": 20},
                                  "completeness_details": {"type": "string"},
                                  "minimality": {"type": "number", "minimum": 0, "maximum": 15},
                                  "minimality_details": {"type": "string"},
                                  "test_quality": {"type": "number", "minimum": 0, "maximum": 10},
                                  "test_quality_details": {"type": "string"},
                                  "total": {"type": "number", "minimum": 0, "maximum": 100}
                              },
                              "required": ["correctness", "correctness_details", "code_quality", "code_quality_details", "completeness", "completeness_details", "minimality", "minimality_details", "test_quality", "test_quality_details", "total"]
                          },
                          "code_examples": {
                              "type": "array",
                              "items": {
                                  "type": "object",
                                  "properties": {
                                      "label": {"type": "string"},
                                      "participant_code": {"type": "string"},
                                      "reference_code": {"type": "string"},
                                      "explanation": {"type": "string"}
                                  },
                                  "required": ["label", "participant_code", "reference_code", "explanation"]
                              }
                          },
                          "comparison": {
                              "type": "object",
                              "properties": {
                                  "approach_divergence": {"type": "string"},
                                  "did_better": {"type": "array", "items": {"type": "string"}},
                                  "missed": {"type": "array", "items": {"type": "string"}},
                                  "suggestions": {"type": "array", "items": {"type": "string"}}
                              }
                          },
                          "summary": {"type": "string"}
                      },
                      "required": ["scores", "code_examples", "comparison", "summary"]
                  }
              }],
              "tool_choice": {"type": "tool", "name": "submit_score"},
              "messages": [{"role": "user", "content": prompt}]
          }
          print(json.dumps(request))
          PYEOF

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST https://api.anthropic.com/v1/messages \
            -H "x-api-key: $ANTHROPIC_API_KEY" \
            -H "content-type: application/json" \
            -H "anthropic-version: 2023-06-01" \
            -d @/tmp/api-request.json)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "API error: HTTP $HTTP_CODE"
            echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
            echo '{}' > /tmp/ai-scores.json
            exit 0
          fi

          echo "$BODY" | jq '.content[] | select(.type == "tool_use") | .input' > /tmp/ai-scores.json
          cat /tmp/ai-scores.json
        continue-on-error: true

      # --- Phase 3: Post Comment ---
      - name: Post evaluation comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const typecheck = '${{ steps.typecheck.outcome }}' === 'success';
            const lassoTests = '${{ steps.lasso-tests.outcome }}' === 'success';
            const regressions = '${{ steps.regressions.outputs.regressions }}' === 'true';
            const failures = '${{ steps.regressions.outputs.failures }}' || '0';

            let aiScores = null;
            try {
              const raw = fs.readFileSync('/tmp/ai-scores.json', 'utf8');
              aiScores = JSON.parse(raw);
            } catch (e) {}

            let body = `## Challenge Evaluation Results\n\n`;
            body += `### Automated Checks\n\n`;
            body += `| Check | Result |\n|-------|--------|\n`;
            body += `| Typecheck | ${typecheck ? '✅ Pass' : '❌ Fail'} |\n`;
            body += `| Lasso Tests | ${lassoTests ? '✅ Pass' : '❌ Fail'} |\n`;
            body += `| Regressions | ${regressions ? '❌ New failures' : '✅ None'} |\n`;
            body += `| Full Suite Failures | ${failures} (baseline: 369) |\n\n`;

            if (aiScores && aiScores.scores) {
              const s = aiScores.scores;
              const capped = (!typecheck || regressions) && s.total > 30;
              const finalTotal = capped ? Math.min(s.total, 30) : s.total;

              body += `### Scores\n\n`;
              body += `| Dimension | Score | Max |\n|-----------|-------|-----|\n`;
              body += `| Correctness | ${s.correctness} | 35 |\n`;
              body += `| Code Quality | ${s.code_quality} | 20 |\n`;
              body += `| Completeness | ${s.completeness} | 20 |\n`;
              body += `| Minimality | ${s.minimality} | 15 |\n`;
              body += `| Test Quality | ${s.test_quality} | 10 |\n`;
              body += `| **Total** | **${finalTotal}** | **100** |\n\n`;

              if (capped) {
                body += `> ⚠️ Score capped at 30 due to ${!typecheck ? 'build failure' : 'regressions'}\n\n`;
              }

              body += `### Detailed Feedback\n\n`;
              if (s.correctness_details) body += `**Correctness (${s.correctness}/35):** ${s.correctness_details}\n\n`;
              if (s.code_quality_details) body += `**Code Quality (${s.code_quality}/20):** ${s.code_quality_details}\n\n`;
              if (s.completeness_details) body += `**Completeness (${s.completeness}/20):** ${s.completeness_details}\n\n`;
              if (s.minimality_details) body += `**Minimality (${s.minimality}/15):** ${s.minimality_details}\n\n`;
              if (s.test_quality_details) body += `**Test Quality (${s.test_quality}/10):** ${s.test_quality_details}\n\n`;

              if (aiScores.code_examples && aiScores.code_examples.length) {
                body += `### Code Examples\n\n`;
                aiScores.code_examples.forEach(ex => {
                  body += `#### ${ex.label}\n\n`;
                  body += `<details>\n<summary>Your code</summary>\n\n\`\`\`typescript\n${ex.participant_code}\n\`\`\`\n</details>\n\n`;
                  body += `<details open>\n<summary>Reference approach</summary>\n\n\`\`\`typescript\n${ex.reference_code}\n\`\`\`\n</details>\n\n`;
                  body += `> ${ex.explanation}\n\n---\n\n`;
                });
              }

              if (aiScores.comparison) {
                const c = aiScores.comparison;
                body += `### Comparison & Suggestions\n\n`;
                if (c.approach_divergence) body += `**Approach:** ${c.approach_divergence}\n\n`;
                if (c.did_better && c.did_better.length) {
                  body += `**What you did well:**\n`;
                  c.did_better.forEach(item => { body += `- ${item}\n`; });
                  body += `\n`;
                }
                if (c.missed && c.missed.length) {
                  body += `**What to improve:**\n`;
                  c.missed.forEach(item => { body += `- ${item}\n`; });
                  body += `\n`;
                }
                if (c.suggestions && c.suggestions.length) {
                  body += `**Actionable suggestions:**\n`;
                  c.suggestions.forEach(item => { body += `- ${item}\n`; });
                  body += `\n`;
                }
              }

              if (aiScores.summary) body += `### Summary\n\n${aiScores.summary}\n\n`;
            } else {
              body += `_AI grading unavailable — configure ANTHROPIC_API_KEY secret to enable._\n\n`;
            }

            body += `---\n_Evaluated by Challenge Framework_`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
